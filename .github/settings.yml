# Repository metadata, declarative.
#
# This file is consumed by the Probot "Settings" GitHub App
# (https://github.com/apps/settings, source at repository-settings/app). That app
# watches the default branch and PATCHes the repository's GitHub-side settings —
# description, topics — to match what is written here. It is the standard meaning
# of the path `.github/settings.yml`.
#
# NOTHING IN THIS FILE IS READ BY CI. `.github/workflows/ci.yml` is the only file
# here that builds or bakes anything; this one describes the repository to GitHub
# and nothing else. It runs no code and gates no job.
#
# It only takes effect if the Settings app is installed on this repository. That
# could not be confirmed from here: an app installation is only visible to the app
# itself (`GET /repos/{owner}/{repo}/installation` needs a JWT signed by the app,
# and `GET /user/installations` needs an app-authorized token — a normal `gh auth`
# token gets 401/403 from both), so assume it is NOT installed unless the owner
# installed it deliberately. Uninstalled, this file is inert and harmless: no app
# reads it, and the repository's settings stay exactly as they are on GitHub.
#
# Two traps worth knowing before editing:
#   - `topics` is a COMMA-SEPARATED STRING, not a YAML list. The app does
#     `topics.split(/\s*,\s*/)`, so a `- item` block list is an array, has no
#     `.split`, and the sync throws.
#   - An unrecognised key can make the app reject the whole file. Only keys the
#     app documents belong here; when unsure, leave it out.
#
# Anything omitted is left alone. `private` and the security flags stay omitted
# for the reason the feature toggles used to: their live values were set by hand
# and restating them here would only create a way to flip one by accident. The
# feature toggles below are now stated deliberately, because the intent is a
# repository that takes ISSUES and nothing else.
#
# PULL REQUESTS CANNOT BE TURNED OFF, here or anywhere. GitHub has no such
# setting and this app has no key for it -- the only PR-adjacent keys are
# `allow_squash_merge` / `allow_merge_commit` / `allow_rebase_merge`, and the
# API rejects disabling all three, so they control HOW a PR merges and never
# WHETHER one can be opened. Anyone able to see a public repository can fork it
# and open one. The real levers, if that ever matters, are branch protection
# (this app's `branches:` section) to control what can actually land, or
# `.github/PULL_REQUEST_TEMPLATE.md` to say so to anyone who tries.
#
# `allow_forking` and `has_discussions` are deliberately NOT here: neither
# appears in the app's documented repository schema
# (repository-settings/app, docs/plugins/repository.md), and per the warning
# above an unrecognised key can make the app reject this entire file. Discussions
# are already off live; forking is left to GitHub's own default.

repository:
  name: "Blackb0x--"

  # Verbatim, at the owner's request. Do not rephrase or extend.
  description: "Modern Apple TV 2/3 Jailbreak based on Blackb0x"

  # `master`, renamed from `linux`. That name was a fossil -- this began as a
  # Linux port, the support was removed outright (checkm8 never worked there),
  # and the branch name outlived the reason.
  #
  # The rename was done through GitHub's own branch-rename API rather than by
  # pushing a new branch and deleting the old one, and that distinction is
  # load-bearing. The default branch is not just a label here: the Settings app
  # only watches the DEFAULT branch, so this file is only read while it sits on
  # that branch; and GitHub Actions caches written on the default branch are
  # readable from every branch, whereas caches written anywhere else are
  # visible only to that branch and its children. CI's pinned-Xcode cache -- a
  # multi-gigabyte entry that several jobs restore -- depends on that. The
  # rename API moves the branch, the default, and everything attached to it;
  # push-and-delete would have orphaned the cache and quietly cost every
  # subsequent run a reassembly.
  default_branch: "master"

  # ISSUES ONLY. Everything else this app can switch off is off.
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false

  # Max 20, lowercase/digits/hyphens, <=35 chars each — GitHub's rules.
  # Both `apple-tv` and `appletv` are present because GitHub's topic search is
  # literal and both spellings are in real use (258 and 125 repos respectively).
  # Scope note: `jailbreak` names the project's domain. No topic here claims a
  # finished or untethered jailbreak — see the README; no device has yet come up
  # jailbroken.
  topics: "apple-tv, appletv, tvos, ios, jailbreak, checkm8, bootrom, exploit, dfu, iboot, ramdisk, cydia, kodi, cpp, cli, macos, reverse-engineering"
