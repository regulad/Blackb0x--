# Assign every newly opened issue to the repository owner.
#
# Uses pozil/auto-assign-issue (GitHub Marketplace: "Auto Assign Issue").
# `@v4` is the action's major-version branch; latest release at time of
# writing is v4.0.1.
name: Auto-assign issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to repository owner
        uses: pozil/auto-assign-issue@v4
        with:
          assignees: ${{ github.repository_owner }}
