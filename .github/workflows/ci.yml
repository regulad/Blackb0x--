# Build and bake on every push; refresh the artifacts monthly besides.
#
# The point of the bake job is that an end user should never need root, Theos,
# apt or a ~30-minute bake to jailbreak a device. bake-firmware produces
# dist/, blackb0x consumes it, and the two halves have completely different
# dependency sets -- see CMakeLists.txt's `jailbreak`/`authoring` targets.
# This publishes dist/ so the authoring half never has to run on their machine.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 23rd of every month. Monthly also stays clear of GitHub disabling
    # scheduled workflows in repos with no activity for 60 days.
    - cron: "0 5 23 * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push. Cheap: no root, no Theos, no network beyond the submodules.
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # debcache/ is LFS. Without this the checkout is 107 pointer files
          # and the failure only surfaces much later, as a bake that cannot
          # read any package.
          lfs: true

      - name: Install build dependencies
        run: |
          brew install cmake autoconf automake libtool pkg-config \
                       ldid afsctool dpkg \
                       berkeley-db@5 openssl@3 xxhash lz4 xz gettext

      # ----------------------------------------------------------------------
      # Vendored-dependency cache
      # ----------------------------------------------------------------------
      # MEASURED, not assumed. On run 35560011769 (all green, cold cache) the
      # `build` job's two compile steps cost 229 s, and essentially all of it
      # is third_party/:
      #   * "Build jailbreak" 111 s -- the last ExternalProject
      #     (libfragmentzip_ext) completes at T+108 s and `blackb0x` links 3 s
      #     later. Every first-party object in the jailbreak half is built
      #     inside that 3 s tail.
      #   * "Build authoring" 118 s -- every first-party target, plus the
      #     fork/exec'd patchers and xpwn, is finished 10 s in; the remaining
      #     108 s is `apt_ext` alone, which is the entire critical path.
      # The three bake legs pay it again: their "Build the authoring tools"
      # step measured 180 s, 211 s and 254 s on the same run.
      #
      # So: cache the DEPENDENCY ARTIFACTS, and let our own sources recompile
      # every time. That is deliberately narrower than caching `build/`. A
      # restored CMakeCache.txt is the classic way this goes wrong -- it
      # records absolute paths and a compiler identity from whichever runner
      # populated it, and when they do not match the failure is confusing
      # rather than loud. `cmake -S . -B build` writes a fresh one below.
      #
      # WHERE THE ARTIFACTS ACTUALLY LAND, checked rather than assumed:
      #   * build/deps -- DEPS_PREFIX (CMakeLists.txt sets it to
      #     ${CMAKE_BINARY_DIR}/deps). Every dependency installs its headers,
      #     static libs and .pc files here; this is what consumers link.
      #   * build/<name>_ext-prefix/src/<name>-stamp/ -- ExternalProject's step
      #     stamps. These are what make a restored cache a cache: with
      #     <name>-done present, the configure/build/install steps are skipped
      #     outright. Nine of the ExternalProjects are BUILD_IN_SOURCE 1, so
      #     their object files live in third_party/<lib>/ (a fresh checkout,
      #     not cached) -- which is fine precisely because the stamps stop
      #     anything from wanting them again, and build/deps already holds the
      #     installed result.
      #   * build/apt-tools -- apt_ext's install step copies the binaries the
      #     bake execs out of its prefix to here, so the stamp alone would be a
      #     lie without it. (build/triehash-bin is NOT cached: CMake recreates
      #     it at configure time as a symlink into third_party/.)
      # Local measurement of that set: ~137 MB uncompressed, most of it
      # apt_ext-prefix and curl_ext-prefix.
      #
      # THE KEY. Two inputs decide a vendored dependency's output: which commit
      # each submodule is pinned at, and the ExternalProject_Add blocks that
      # configure them -- all of which live in the root CMakeLists.txt.
      # `git submodule status --recursive` is the direct expression of the
      # first: one line per submodule, printing its SHA, changing if and only
      # if a pin moves. The compiler version and runner OS/arch go in as well,
      # because a hosted-image Xcode bump changes the ABI of everything cached
      # and neither of the first two inputs would notice.
      #
      # NO restore-keys, deliberately. A partial match would serve dependency
      # binaries built from a DIFFERENT submodule commit, and the failure would
      # be a subtle link-time or runtime mismatch rather than an obvious error.
      # Exact hit or full rebuild is the honest policy for vendored native code.
      #
      # One residual risk, stated rather than hidden: the cached `apt` links
      # Homebrew's berkeley-db@5/openssl@3, and a Homebrew bump does not change
      # this key. It fails LOUDLY at the existing `apt-get --version` assertion
      # at the end of this job rather than silently, and the fix is to bump the
      # `v1` below. Putting `brew list --versions` in the key instead would
      # cost a full rebuild every time any of a dozen formulas moved.
      - name: Compute the vendored-dependency cache key
        id: deps-key
        run: |
          set -eu
          {
            git submodule status --recursive
            shasum -a 256 CMakeLists.txt
            cc --version
          } > "$RUNNER_TEMP/deps-key-inputs.txt"
          digest=$(shasum -a 256 "$RUNNER_TEMP/deps-key-inputs.txt" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "cache key inputs:"
          cat "$RUNNER_TEMP/deps-key-inputs.txt"

      # The `bake` job restores this same key (restore-only -- it never builds
      # the jailbreak half, so its tree is a subset and saving from there would
      # be strictly worse). `needs: build` guarantees this job's post-step save
      # has already run.
      - name: Cache the vendored dependency builds
        uses: actions/cache@v4
        with:
          path: |
            build/deps
            build/apt-tools
            build/*_ext-prefix
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps-key.outputs.digest }}

      - name: Configure
        run: cmake -S . -B build

      # Built separately and first so a failure here is legible as "the
      # jailbreak half broke" rather than being buried in the authoring half's
      # much longer output.
      - name: Build jailbreak
        run: cmake --build build --target jailbreak -j"$(sysctl -n hw.ncpu)"

      - name: Build authoring
        run: cmake --build build --target authoring -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          python3 scripts/test_build_deb_cache_experimental_no_container.py

      # ----------------------------------------------------------------------
      # Pinned Xcode toolchain for entrypoint/
      # ----------------------------------------------------------------------
      # entrypoint/Makefile builds with a PINNED, era-appropriate Xcode and
      # DELIBERATELY DOES NOT FALL BACK to the system compiler -- an
      # unresolvable pin is a hard error, because a build that silently used
      # the wrong compiler is the exact failure the pin exists to prevent. Its
      # default discovery looks in ~/Downloads, which no runner has. So every
      # job that builds entrypoint/ has to hand it a toolchain outright, and
      # this block is how. Without it the "Check the built artifacts" step
      # below fails at `make -C entrypoint`, by design and not by accident.
      #
      # The interface is two environment variables and nothing else -- no flag,
      # no file edit. `XCODE_TOOLCHAIN=<dir>` is used verbatim and bypasses
      # ~/Downloads discovery entirely; `DEVICE=<model>` picks which Xcode the
      # Makefile expects. Both are `?=` in the Makefile and BakeRamdisk.cpp
      # invokes make through fork()/execvp(), which inherits `environ`, so
      # exporting them is enough -- with one exception, noted at the bake job's
      # Bake step, where `sudo` drops the environment.
      #
      # WHY THE WHOLE Xcode AND NOT JUST AN SDK: Apple's current `ld` never
      # implemented 32-bit ARM. It detects armv6/armv7/armv7s and silently
      # delegates to `ld-classic`, a frozen ld64-957.1 fork deprecated since
      # Xcode 15; an SDK is headers plus link stubs and contains no linker at
      # all, so pinning one would hedge nothing. Full account in
      # entrypoint/README.md's "Pinned toolchain".
      #
      # The bake job repeats these five steps with `${{ matrix.device }}` in
      # place of the fixed device below. GitHub Actions supports neither YAML
      # anchors nor step-level reuse inside a single workflow file, so the
      # duplication is unavoidable short of a composite action; the reasoning
      # is written out once, here.

      # AppleTV3,2 -> Xcode 6.4, which is also entrypoint/Makefile's own
      # default XCODE_VERSION, so this job builds exactly what a developer
      # running `make -C entrypoint` by hand would get. It also shares a cache
      # entry with two of the three bake legs, which both map to 6.4.
      #
      # The version is READ OUT OF THE MAKEFILE, not spelled here, for the same
      # reason no build ID appears in this workflow (see the bake job): the
      # device -> Xcode mapping is a decision that lives in
      # entrypoint/Makefile's XCODE_FOR_* lines, and a copy here would be a
      # second place to edit and a silent way to provision 6.4 while the
      # Makefile asks for 5.1.1. If those lines change shape this fails loudly
      # and by name.
      - name: Resolve which pinned Xcode entrypoint/ needs
        id: xcode
        env:
          DEVICE: AppleTV3,2
        run: |
          set -eu
          version=$(sed -n "s/^XCODE_FOR_${DEVICE}[[:space:]]*:=[[:space:]]*//p" \
                    entrypoint/Makefile | head -n 1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "could not read XCODE_FOR_${DEVICE} out of entrypoint/Makefile --" \
                 "has the per-device toolchain mapping moved or changed shape?" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "entrypoint/Makefile maps $DEVICE to Xcode $version"

      # Every binary in these toolchains is x86_64 with no arm64 slice --
      # Xcode 6.4 predates Apple Silicon by five years. macos-15 is an Apple
      # Silicon runner (macos-15-intel is the separate x86_64 label), so clang
      # and ld only run here under Rosetta 2, and Rosetta is NOT preinstalled.
      # Both architectures are handled rather than assumed, so moving this
      # workflow to an Intel label later is a no-op instead of a mystery.
      # `arch -x86_64 /usr/bin/true` is the real probe: it answers "can this
      # host execute an x86_64 binary", which is the actual question, rather
      # than looking for a receipt somewhere that says it should be able to.
      - name: Install Rosetta 2 if this runner needs it
        run: |
          set -eu
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != arm64 ]; then
            echo "x86_64 host -- the pinned toolchain runs natively, no Rosetta needed"
            exit 0
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 already present"
            exit 0
          fi
          sudo softwareupdate --install-rosetta --agree-to-license
          # Not decoration: softwareupdate can report success and still leave
          # nothing able to run, and the next thing that would notice is a
          # clang invocation deep inside a bake.
          arch -x86_64 /usr/bin/true

      # CI cannot download these images from Apple. The developer.apple.com
      # asset needs an authenticated Apple ID session, and the failure mode is
      # a trap: an anonymous request 302s to the unauthorized page and returns
      # ~257 bytes of HTML with HTTP 200, so `curl -f` *succeeds* while writing
      # an error page where a 2.6 GB disk image should be. Hence the private
      # mirror, which stores each DMG as 1 GiB Git LFS parts (GitHub LFS caps
      # a single object at 2 GB).
      #
      # GIT_LFS_SKIP_SMUDGE=1 clones the POINTERS ONLY -- 212 KB, no LFS
      # bandwidth spent. That is the whole trick behind the cache key below:
      # each pointer file literally contains its object's sha256 OID and size,
      # so the runner can decide whether its cached image is still valid before
      # downloading a single byte of DMG.
      #
      # secrets.PAT, not secrets.GITHUB_TOKEN: the default token is scoped to
      # this repository and cannot read another one, and in practice cannot do
      # LFS on one either. It is passed through the environment rather than
      # interpolated into the script text, and nothing here runs under `set -x`.
      #
      # The clone lands inside the workspace because hashFiles() resolves its
      # pattern relative to GITHUB_WORKSPACE and matches nothing outside it --
      # a pointer tree in $RUNNER_TEMP would silently hash to the empty string
      # and produce a stable, wrong, permanently-hit cache key.
      - name: Check out the Xcode mirror's LFS pointers
        env:
          XCODE_MIRROR_TOKEN: ${{ secrets.PAT }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
        run: |
          set -eu
          if [ -z "${XCODE_MIRROR_TOKEN:-}" ]; then
            echo "secrets.PAT is empty. entrypoint/ cannot be built without a pinned" \
                 "Xcode, and regulad/xcode is private, so there is nothing to fall" \
                 "back to. Set the PAT repository secret to a token with read access" \
                 "to regulad/xcode." >&2
            exit 1
          fi
          rm -rf xcode-mirror
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            "https://x-access-token:${XCODE_MIRROR_TOKEN}@github.com/regulad/xcode.git" \
            xcode-mirror
          # Assert the pointers are really pointers before hashFiles() is asked
          # to key a multi-gigabyte cache on them. A glob that did not expand
          # leaves the literal pattern here and grep fails on it, which is the
          # loud failure we want.
          for p in xcode-mirror/parts/"$XCODE_VERSION"/*.part??; do
            grep -q '^oid sha256:' "$p" || {
              echo "$p is not a Git LFS pointer -- the mirror's layout changed," \
                   "or this clone resolved LFS objects when it should not have." >&2
              exit 1
            }
          done
          echo "pointers for Xcode $XCODE_VERSION:"
          cat xcode-mirror/parts/"$XCODE_VERSION"/*.part??

      # THE WHOLE DMG IS CACHED, NOT THE ~85 MiB SUBSET THE BUILD ACTUALLY
      # USES. Caching the subset would pin the entry to today's extraction
      # list: the first time a job needs a file that was not on it, the entry
      # is useless and the runner pays a full multi-gigabyte LFS re-fetch. The
      # image is the stable artifact; the extraction list is a per-run detail,
      # and changing it should be a different `cp` out of a cache entry already
      # on disk.
      #
      # The key is the pointer hash, so it changes exactly when the underlying
      # LFS objects change and never otherwise. It is keyed on the Xcode
      # VERSION rather than the device, so the two AppleTV3,x bake legs share
      # one entry; steady state is two entries (~4.7 GiB) inside the 10 GB
      # per-repository budget. runner.os is in there because a cache is
      # restored across runner images and this one is only ever consumed by a
      # macOS `hdiutil`.
      #
      # restore/save rather than the combined action, purely for disk: an
      # explicit save lets the DMG be deleted immediately after extraction on
      # BOTH paths, instead of having to survive to the end of the job so the
      # combined action's post step can pick it up. A bake leg goes on to
      # download an IPSW and build a ramdisk, and 2.6 GB of dead weight through
      # all of that is worth one extra step to avoid.
      - name: Restore the cached Xcode disk image
        id: xcode-dmg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xcode-dmg
          key: xcode-dmg-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles(format('xcode-mirror/parts/{0}/*', steps.xcode.outputs.version)) }}

      # --fetch --consume is the mirror's documented CI mode and is what keeps
      # this inside a runner's disk budget: it LFS-pulls each part immediately
      # before merging it and deletes it immediately after, so peak usage is
      # the output image plus one 1 GiB part rather than both copies at once.
      # Only this leg's version is ever fetched; nothing needs both images.
      #
      # reassemble.sh verifies the merged image's byte size and sha256 against
      # its manifest and DELETES the output on any mismatch, missing part or
      # failed append, so there is no way to end up with a plausible-looking
      # half-merged DMG. It also refuses to concatenate unresolved pointer text
      # into an image.
      - name: Reassemble the Xcode disk image
        if: steps.xcode-dmg.outputs.cache-hit != 'true'
        working-directory: xcode-mirror
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/xcode-dmg"
          ./reassemble.sh --fetch --consume --out "$RUNNER_TEMP/xcode-dmg" \
            '${{ steps.xcode.outputs.version }}'

      # Saved before extraction, so the image can be deleted the moment it has
      # been mined. The three bake legs run in parallel and two of them key on
      # the same 6.4 pointers, so on a cold cache both will reassemble and both
      # will try to save; the loser gets a "cache already exists" WARNING, not
      # a failure, and the entry is correct either way. Deduplicating that
      # would mean a separate serialising job for a cost paid once per Xcode
      # release, which is to say roughly never.
      - name: Save the Xcode disk image to the cache
        if: steps.xcode-dmg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xcode-dmg
          key: ${{ steps.xcode-dmg.outputs.cache-primary-key }}

      # The minimum that builds, rooted at Xcode.app/Contents/Developer:
      # clang, ld, clang's resource directory, and the SDK's usr/include,
      # usr/lib and SDKSettings.plist. ~85 MiB for 6.4, ~184 MiB for 5.1.1.
      #
      # `as` is deliberately NOT copied -- clang uses its integrated assembler
      # for this build, confirmed with `clang -###`. Nor is libLTO.dylib, which
      # ld references lazily and only wants for -flto.
      #
      # THE SDK IS LOAD-BEARING. entrypoint is a dynamically linked armv7
      # binary now, not a freestanding armv6 one, so it links against this
      # SDK's libSystem.B.dylib stub -- and the pairing is not interchangeable:
      # matched is 0 phantom symbols on both branches, while an 8.4 SDK against
      # a 7.1.2 device advertises 787 symbols the device does not export, the
      # class that links clean and dies at dyld load with no console to say so.
      # entrypoint/Makefile finds it under the toolchain root laid out below
      # (SDKs/iPhoneOS<ver>.sdk) and picks the version from XCODE_VERSION,
      # which DEVICE selects -- so the device -> Xcode -> SDK chain is decided
      # in one place and this step only has to hand over the whole SDK.
      #
      # Laid out as a bare toolchain root (usr/bin/clang at the top) because
      # that is the first shape XCODE_TOOLCHAIN probes for, and handing over a
      # 100 MiB directory beats handing over a 2.6 GB mounted app bundle.
      - name: Extract the pinned toolchain
        env:
          DEVICE: ${{ steps.xcode.outputs.device }}
        run: |
          set -eu
          # Globbed, not named: the two images do not agree on capitalisation
          # (Xcode_6.4.dmg vs xcode_5.1.1.dmg) and the real names are the
          # mirror manifest's to own, not this workflow's to restate. Exactly
          # one image is ever present here.
          dmg=''
          for c in "$RUNNER_TEMP"/xcode-dmg/*.dmg; do
            [ -f "$c" ] || continue
            dmg="$c"
            break
          done
          if [ -z "$dmg" ]; then
            echo "no Xcode disk image in $RUNNER_TEMP/xcode-dmg -- the cache restore" \
                 "reported a hit but produced nothing, or reassembly was skipped." >&2
            exit 1
          fi

          mnt="$RUNNER_TEMP/xcode-mnt"
          tc="$RUNNER_TEMP/xcode-toolchain"
          rm -rf "$mnt" "$tc"
          mkdir -p "$mnt"

          # Whatever is attached gets detached, on success, failure or signal.
          detach() {
            hdiutil detach -quiet "$mnt" >/dev/null 2>&1 \
              || hdiutil detach -quiet -force "$mnt" >/dev/null 2>&1 \
              || echo "warning: could not detach $mnt" >&2
          }
          trap detach EXIT INT TERM
          # `yes | PAGER=cat` answers the image's embedded software licence
          # agreement, which hdiutil otherwise waits on forever with no tty.
          yes | PAGER=cat hdiutil attach -quiet -nobrowse -readonly -noverify \
            -noautoopen -mountpoint "$mnt" "$dmg"

          dev="$mnt/Xcode.app/Contents/Developer"
          xct="$dev/Toolchains/XcodeDefault.xctoolchain"
          [ -x "$xct/usr/bin/clang" ] || {
            echo "$dmg does not contain XcodeDefault.xctoolchain/usr/bin/clang" >&2
            exit 1
          }

          mkdir -p "$tc/usr/bin" "$tc/usr/lib/clang" "$tc/SDKs"
          cp "$xct/usr/bin/clang" "$xct/usr/bin/ld" "$tc/usr/bin/"
          cp -R "$xct/usr/lib/clang/"* "$tc/usr/lib/clang/"

          # WHICH SDK NAME IS THE REAL DIRECTORY AND WHICH IS THE SYMLINK IS
          # NOT THE SAME IN BOTH IMAGES. Xcode 6.4 ships iPhoneOS.sdk as the
          # real tree with iPhoneOS8.4.sdk pointing at it; Xcode 5.1.1 is the
          # other way round. Copying the name rather than resolving it yields a
          # dangling link in one of the two cases, which would only surface
          # once something actually tried to use the SDK. So: find the entry
          # that is a directory and NOT a symlink, copy that, and recreate the
          # alias relatively.
          sdks="$dev/Platforms/iPhoneOS.platform/Developer/SDKs"
          real=''
          for c in "$sdks"/iPhoneOS*.sdk; do
            [ -d "$c" ] && [ ! -L "$c" ] || continue
            real="$c"
            break
          done
          [ -n "$real" ] || {
            echo "no real iPhoneOS SDK directory under $sdks" >&2
            exit 1
          }
          name=$(basename "$real")
          mkdir -p "$tc/SDKs/$name/usr"
          cp -R "$real/usr/include" "$tc/SDKs/$name/usr/include"
          cp -R "$real/usr/lib" "$tc/SDKs/$name/usr/lib"
          cp "$real/SDKSettings.plist" "$tc/SDKs/$name/"

          # The two FRAMEWORKS entrypoint links, and only those two.
          #
          # This subset was measured back when entrypoint linked nothing but
          # libSystem, and System/Library/Frameworks was correctly excluded as
          # dead weight -- it is ~104 MiB in the 6.4 SDK. That stopped being
          # true when the on-screen debug console landed: entrypoint now links
          # IOSurface (to write into the surface restored_external is already
          # scanning out) and CoreFoundation (for CFRelease alone, so the ID
          # sweep does not leak every surface it probes).
          #
          # A framework's stub lives at
          # System/Library/[Private]Frameworks/X.framework/X -- a different
          # directory from usr/lib, and with no .dylib extension -- so copying
          # usr/lib cannot pick it up. The link failed on the Makefile's own
          # FATAL guard, which is exactly the right failure: loud, at build
          # time, naming the missing path. Copying these two keeps the subset
          # small, since the stubs are a few hundred KB rather than the whole
          # 104 MiB tree.
          #
          # Named explicitly rather than globbed: if a future dependency is
          # added and not listed here, the Makefile's guard fails right at this
          # step. A silent miss would instead produce a binary that cannot load
          # on the device, and this project has paid for that class of bug
          # several times already.
          mkdir -p "$tc/SDKs/$name/System/Library/Frameworks" \
                   "$tc/SDKs/$name/System/Library/PrivateFrameworks"
          cp -R "$real/System/Library/PrivateFrameworks/IOSurface.framework" \
                "$tc/SDKs/$name/System/Library/PrivateFrameworks/"
          cp -R "$real/System/Library/Frameworks/CoreFoundation.framework" \
                "$tc/SDKs/$name/System/Library/Frameworks/"

          ln -s "$name" "$tc/SDKs/iPhoneOS.sdk"

          detach
          trap - EXIT INT TERM

          # The image is 2.6 GB and has already been mined and cached. Nothing
          # downstream reads it again.
          rm -rf "$RUNNER_TEMP/xcode-dmg"

          # Prove the toolchain RUNS on this host -- this is where a missing
          # Rosetta, a truncated copy or a stale extraction list surfaces,
          # rather than halfway through a build. ld printing its PROJECT:ld64-
          # banner is also the evidence that the pin did what it exists to do:
          # a native 32-bit-ARM linker, not a delegation to ld-classic.
          "$tc/usr/bin/clang" --version
          "$tc/usr/bin/ld" -v 2>&1 | head -1
          du -sh "$tc"

          echo "XCODE_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # Guards the invariants that actually broke during the macOS port, so a
      # regression shows up here rather than on a device. See the commit that
      # introduced them.
      #
      # `make -C entrypoint` below picks up XCODE_TOOLCHAIN and DEVICE from the
      # job environment (both are `?=` in entrypoint/Makefile, and make imports
      # the environment as make variables), so the pinned toolchain provisioned
      # above is used with no flag and no file edit.
      - name: Check the built artifacts
        run: |
          set -eux
          # Nothing from Homebrew or /usr/local may reach the final binaries --
          # every dependency is vendored and statically linked.
          for bin in build/blackb0x build/blackb0x-pwn build/bake-firmware; do
            if otool -L "$bin" | grep -qE '/opt/homebrew|/usr/local'; then
              echo "$bin links something outside the system frameworks" >&2
              otool -L "$bin" >&2
              exit 1
            fi
          done
          # entrypoint runs as PID 1 on the ramdisk, and it is a DYNAMICALLY
          # LINKED armv7 Mach-O -- the same shape Apple's own /sbin/launchd
          # has on both target ramdisks (LC_MAIN + LC_LOAD_DYLINKER against
          # libSystem), which is the configuration known to boot on this
          # hardware. These assertions used to demand the opposite
          # (freestanding armv6, LC_UNIXTHREAD, zero LC_LOAD_DYLIB); all three
          # inverted with the conversion.
          #
          # Note `! otool ... | grep` is avoided throughout: a leading !
          # disables errexit for that command (shellcheck SC2251), so a
          # regression would scroll past and the step would still pass.
          make -C entrypoint clean all
          file entrypoint/entrypoint | grep -q 'Mach-O executable arm_v7'

          # LC_MAIN, not LC_UNIXTHREAD. dyld calls main() through entryoff;
          # there is no crt startup glue (-nostdlib) and none is needed.
          otool -l entrypoint/entrypoint | grep -q 'cmd LC_MAIN'
          if otool -l entrypoint/entrypoint | grep -q 'cmd LC_UNIXTHREAD'; then
            echo "entrypoint has LC_UNIXTHREAD -- it should be LC_MAIN" >&2
            exit 1
          fi

          # EXACTLY THESE THREE dylibs, by name, no more and no fewer.
          #
          # This used to demand exactly one (libSystem). It is three now: the
          # on-screen debug console (entrypoint/screen.h) links IOSurface and
          # CoreFoundation, because /dev/console on this ramdisk is wired up
          # but does NOT reach the display once restored_external points the
          # display pipe at its own IOSurfaces -- measured on hardware -- so
          # drawing pixels ourselves is the only way to get output off the
          # device.
          #
          # The check is a whole-SET comparison rather than a count plus a
          # grep, so it is strictly STRONGER than the old one: an unexpected
          # fourth dependency fails, and so does a substitution that keeps the
          # count the same. Every allowed library is named here; adding one
          # means editing this list and re-verifying the closure against the
          # real firmware, not against an SDK stub.
          #
          # Verified present, with every symbol entrypoint needs, on all
          # THREE ramdisk generations this project can bake (12H1006, 11D258,
          # 10B329a): transitive closures of 42 / 38 / 33 entries, zero
          # missing, and the binary's 58 undefined symbols resolve 58/58 on
          # each, identically on both the AppleTV3,x (iPhoneOS 8.4) and
          # AppleTV2,1 (iPhoneOS 7.1) builds. bakeRamdisk()'s
          # verifyEntrypointRuntimeClosure() re-proves it against the real
          # mounted image on every bake.
          printf '%s\n' \
            '/System/Library/Frameworks/CoreFoundation.framework/CoreFoundation' \
            '/System/Library/PrivateFrameworks/IOSurface.framework/IOSurface' \
            '/usr/lib/libSystem.B.dylib' \
            | sort > /tmp/entrypoint-dylibs-expected
          otool -L entrypoint/entrypoint | tail -n +2 \
            | sed -e 's/ (compatibility.*//' -e 's/^[[:space:]]*//' \
            | sort > /tmp/entrypoint-dylibs-actual
          if ! diff -u /tmp/entrypoint-dylibs-expected /tmp/entrypoint-dylibs-actual; then
            echo "entrypoint's LC_LOAD_DYLIB set is not the allowed set" >&2
            echo "  (expected above with -, got with +)" >&2
            exit 1
          fi

          # dyld has to be where the binary says it is. /usr/lib/dyld is
          # present on both ramdisks.
          otool -l entrypoint/entrypoint | grep -A2 LC_LOAD_DYLINKER \
            | grep -q 'name /usr/lib/dyld'

          # LC_VERSION_MIN_IPHONEOS, which is what stamps the deployment
          # target the SDK pairing is chosen for.
          otool -l entrypoint/entrypoint | grep -q 'cmd LC_VERSION_MIN_IPHONEOS'

          # No load command a 2012/2015 dyld would not understand. The current
          # output is already clean; this is here so a toolchain change cannot
          # quietly introduce one.
          if otool -l entrypoint/entrypoint \
             | grep -qE 'LC_DYLD_CHAINED_FIXUPS|LC_DYLD_EXPORTS_TRIE|LC_BUILD_VERSION'; then
            echo "entrypoint carries a modern load command no era dyld can read" >&2
            exit 1
          fi

          # ARM MODE, NOT THUMB. This used to enforce itself -- the `rsbcs` in
          # the hand-rolled syscall trampolines would not assemble outside an
          # IT block -- and with that asm deleted it does not, so it is
          # asserted directly. Two independent checks: ld64 sets bit 0 of
          # LC_MAIN's entryoff for a Thumb entry point, so an odd entryoff is
          # a Thumb _main; and ARM encodings are 4 bytes (8 hex digits) where
          # Thumb is 2.
          entryoff=$(otool -l entrypoint/entrypoint \
                     | awk '/cmd LC_MAIN/{f=1} f && /entryoff/{print $2; exit}')
          if [ -z "$entryoff" ] || [ $((entryoff % 2)) -ne 0 ]; then
            echo "entrypoint's LC_MAIN entryoff is '$entryoff' -- odd means a Thumb entry point" >&2
            exit 1
          fi
          insn=$(otool -tv entrypoint/entrypoint | awk '/^_main:/{getline; print $2; exit}')
          if ! printf '%s' "$insn" | grep -qE '^[0-9a-f]{8}$'; then
            echo "first instruction of _main is '$insn' -- not a 4-byte ARM encoding" >&2
            exit 1
          fi

          # Signed under its OWN identifier. It used to be
          # `com.apple.launchd`, because the binary was spliced over
          # /sbin/launchd's content and ran as PID 1. It no longer is: Apple's
          # launchd is left byte-for-byte untouched on every path, and we
          # attach at whichever hook the ramdisk generation actually reaches
          # (a LaunchDaemon plist on 12H1006, /etc/rc.boot on the older
          # generation). Deliberately NOT `com.apple.rc` on that older branch
          # either -- nothing establishes that the identifier matters to AMFI
          # here, and a second identity would fork the artifact for no
          # measured benefit. See entrypoint/README.md.
          codesign -dv entrypoint/entrypoint 2>&1 | grep -q 'Identifier=xyz.regulad.blackb0x.entrypoint'
          # The vendored apt has to actually run, not just link.
          # stderr is discarded on purpose: with no APT_CONFIG pointing at a
          # synthetic root, apt correctly complains it cannot find a packaging
          # system. --version still prints, which is all this asserts.
          ./build/apt-tools/apt-get --version 2>/dev/null | grep -q 'darwin-arm'

  # Runs on every push, plus the monthly schedule and manual dispatch. Needs
  # root, Theos and the network, which is exactly the set of requirements this
  # job exists to keep off end users' machines.
  #
  # Not on pull_request: this executes the branch's own code under sudo, and a
  # fork PR is untrusted by definition. Pushes to this repo are not, and the
  # schedule covers refreshing artifacts when nothing has been pushed.
  bake:
    name: Bake ${{ matrix.device }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    strategy:
      # One device per runner. The tuples are independent, and a failure on one
      # device should not deny the others their artifacts.
      fail-fast: false
      matrix:
        # All three devices. AppleTV2,1 and AppleTV3,1 were excluded here for a
        # long time because both died on `KernelCache: patch failed` while
        # AppleTV3,2 succeeded -- two permanently-red legs would have trained
        # everyone to ignore the colour, so they were left out until the cause
        # was fixed rather than listed and tolerated.
        #
        # The cause was real and on the read side of xpwn's img3 parser:
        # readImg3Element() filled only `dataSize` bytes while setKeyImg3() went
        # on to AES-CBC decrypt the whole 16-aligned DATA body, so the tail was
        # calloc zeros rather than ciphertext and the final cipher block came
        # out garbage. Fixed in regulad/xpwn@legacy `78cc777` (submodule bumped
        # in 273267c); 66 of 101 known tuples flip to success with it, and all
        # three devices were confirmed by hand to bake a complete kernelcache
        # at 10B329a, the build this matrix used to bake. Nothing about the
        # failure was device-specific -- AppleTV3,2 only ever passed because
        # its DATA size happened to be block-aligned. Per-tuple results for the
        # builds actually targeted now are in
        # misc/verified_patcher_compatible.txt, measured by running both patch
        # tools rather than inferred from version numbers.
        #
        # This list stays literal while the build below is derived: the three
        # models are fixed hardware and cannot grow, whereas which build each
        # one targets is a decision in src/Cli.cpp that has already moved once.
        #
        # Baking touches no hardware. AppleTV3,1 needs an Arduino running
        # synackuk's checkm8-A5 to pwn DFU (see src/Cli.cpp), but that is a
        # RUNTIME requirement of the exploit; a bake downloads an IPSW, patches
        # it and writes dist/, so all three legs run identically on a stock
        # runner with nothing plugged into it.
        device: ["AppleTV2,1", "AppleTV3,1", "AppleTV3,2"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install build and bake dependencies
        run: |
          brew install cmake autoconf automake libtool pkg-config \
                       ldid afsctool dpkg \
                       berkeley-db@5 openssl@3 xxhash lz4 xz gettext

      # build.sh only ever calls bin/dm.pl, a standalone Perl script using core
      # modules only (English, File::Find, File::Spec, Cwd, Getopt::Long,
      # Pod::Usage, Archive::Tar, IPC::Open2), so none of Theos' toolchain is
      # needed.
      #
      # But bin/dm.pl is a SYMLINK to ../vendor/dm.pl/dm.pl, and vendor/dm.pl
      # is a Theos submodule. A plain shallow clone leaves it empty, the
      # symlink dangles, and build.sh's `[ ! -x "$THEOS_DIR/bin/dm.pl" ]`
      # reports "no dm.pl" -- which is exactly how this failed the first time
      # it ran. One submodule, fetched shallowly; still no toolchain.
      - name: Install Theos (dm.pl only)
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --depth 1 vendor/dm.pl
          test -x "$HOME/theos/bin/dm.pl"

      # Same key, same reasoning, same measured motivation as the identical
      # block in the `build` job above -- this leg's "Build the authoring
      # tools" step measured 180-254 s on a cold cache, effectively all of it
      # third_party/. RESTORE ONLY: `build` has already saved an entry built
      # from a superset of these targets (it builds both groups), `needs:
      # build` means that save has completed, and a save from here would only
      # race the three legs against each other over a smaller tree. A miss is
      # not an error; it just rebuilds.
      - name: Compute the vendored-dependency cache key
        id: deps-key
        run: |
          set -eu
          {
            git submodule status --recursive
            shasum -a 256 CMakeLists.txt
            cc --version
          } > "$RUNNER_TEMP/deps-key-inputs.txt"
          digest=$(shasum -a 256 "$RUNNER_TEMP/deps-key-inputs.txt" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore the vendored dependency builds
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps
            build/apt-tools
            build/*_ext-prefix
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps-key.outputs.digest }}

      - name: Build the authoring tools
        run: |
          cmake -S . -B build
          cmake --build build --target authoring -j"$(sysctl -n hw.ncpu)"

      # NO BUILD ID APPEARS IN THIS WORKFLOW. It is read out of the code, from
      # `kJailbreakTargets[]` in src/Cli.cpp -- the same per-device table
      # blackb0x itself resolves through jailbreakTargetBuildFor(), whose own
      # comment states the invariant this relies on: "THIS TABLE IS MEANT TO BE
      # EDITED... No build ID is hardcoded anywhere else in the tree." A copy
      # here would be a second place to edit and a silent way to bake a suite
      # nothing downloads, since blackb0x looks up
      # Manifest-<device>_<build>.txt by exact name.
      #
      # That matters right now: AppleTV3,1/3,2 target 12H1006 (tvOS 8.4.7) and
      # may yet move back a build or two, because the ramdisk at that version
      # has not been shown to fit under the hard 64 MiB ceiling. Deriving means
      # that move needs no change here at all.
      #
      # Only the targeted build, never the full sweep: one suite per model is
      # all blackb0x ever asks for, so baking all ~100 known tuples would spend
      # hours producing artifacts nothing downloads.
      #
      # Parses the table's `{"AppleTV3,2", "12H1006"},` initializer rows. If
      # that shape ever changes this fails loudly and by name, which is the
      # right outcome: there is no sane build to fall back to, and baking the
      # wrong one wastes ~30 minutes per leg to produce an unusable artifact.
      # Nothing here re-checks that the resolved build has a
      # keys/<device>/<device>_<build>.keys file -- bake-firmware enumerates
      # keys/ to build its target list and already refuses immediately, by
      # name, when a --build filter matches nothing.
      - name: Resolve the target build for this device
        id: target
        run: |
          set -eu
          build=$(sed -n 's/.*{"${{ matrix.device }}", *"\([^"]*\)".*/\1/p' src/Cli.cpp | head -n 1)
          if [ -z "$build" ]; then
            echo "could not read a target build for ${{ matrix.device }} out of" \
                 "kJailbreakTargets[] in src/Cli.cpp -- has the table moved or changed shape?" >&2
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "src/Cli.cpp targets ${{ matrix.device }} at $build"

      # ----------------------------------------------------------------------
      # Pinned Xcode toolchain for entrypoint/
      # ----------------------------------------------------------------------
      # bake-firmware's ramdisk half calls buildEntrypointBinary(), which runs
      # `make -C entrypoint`, which builds with a pinned Xcode and hard-fails
      # rather than falling back to the system compiler. The full reasoning --
      # why a whole Xcode and not an SDK, why the pointer-only clone, why the
      # DMG rather than the extracted subset is what gets cached, why Rosetta
      # -- is written out once at the identical block in the `build` job above.
      # Only the differences are noted here.
      #
      # The difference that matters: this leg's device comes from the matrix,
      # so each of the three legs provisions exactly the one Xcode its device
      # maps to and never both. AppleTV3,1 and AppleTV3,2 both map to 6.4 and
      # therefore share a cache entry; AppleTV2,1 maps to 5.1.1 and has its own.
      - name: Resolve which pinned Xcode entrypoint/ needs
        id: xcode
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -eu
          version=$(sed -n "s/^XCODE_FOR_${DEVICE}[[:space:]]*:=[[:space:]]*//p" \
                    entrypoint/Makefile | head -n 1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "could not read XCODE_FOR_${DEVICE} out of entrypoint/Makefile --" \
                 "has the per-device toolchain mapping moved or changed shape?" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "entrypoint/Makefile maps $DEVICE to Xcode $version"

      - name: Install Rosetta 2 if this runner needs it
        run: |
          set -eu
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != arm64 ]; then
            echo "x86_64 host -- the pinned toolchain runs natively, no Rosetta needed"
            exit 0
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 already present"
            exit 0
          fi
          sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Check out the Xcode mirror's LFS pointers
        env:
          XCODE_MIRROR_TOKEN: ${{ secrets.PAT }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
        run: |
          set -eu
          if [ -z "${XCODE_MIRROR_TOKEN:-}" ]; then
            echo "secrets.PAT is empty. entrypoint/ cannot be built without a pinned" \
                 "Xcode, and regulad/xcode is private, so there is nothing to fall" \
                 "back to. Set the PAT repository secret to a token with read access" \
                 "to regulad/xcode." >&2
            exit 1
          fi
          rm -rf xcode-mirror
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            "https://x-access-token:${XCODE_MIRROR_TOKEN}@github.com/regulad/xcode.git" \
            xcode-mirror
          for p in xcode-mirror/parts/"$XCODE_VERSION"/*.part??; do
            grep -q '^oid sha256:' "$p" || {
              echo "$p is not a Git LFS pointer -- the mirror's layout changed," \
                   "or this clone resolved LFS objects when it should not have." >&2
              exit 1
            }
          done
          echo "pointers for Xcode $XCODE_VERSION:"
          cat xcode-mirror/parts/"$XCODE_VERSION"/*.part??

      - name: Restore the cached Xcode disk image
        id: xcode-dmg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xcode-dmg
          key: xcode-dmg-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles(format('xcode-mirror/parts/{0}/*', steps.xcode.outputs.version)) }}

      - name: Reassemble the Xcode disk image
        if: steps.xcode-dmg.outputs.cache-hit != 'true'
        working-directory: xcode-mirror
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/xcode-dmg"
          ./reassemble.sh --fetch --consume --out "$RUNNER_TEMP/xcode-dmg" \
            '${{ steps.xcode.outputs.version }}'

      - name: Save the Xcode disk image to the cache
        if: steps.xcode-dmg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xcode-dmg
          key: ${{ steps.xcode-dmg.outputs.cache-primary-key }}

      - name: Extract the pinned toolchain
        env:
          DEVICE: ${{ steps.xcode.outputs.device }}
        run: |
          set -eu
          # Globbed, not named: the two images do not agree on capitalisation
          # (Xcode_6.4.dmg vs xcode_5.1.1.dmg) and the real names are the
          # mirror manifest's to own, not this workflow's to restate. Exactly
          # one image is ever present here.
          dmg=''
          for c in "$RUNNER_TEMP"/xcode-dmg/*.dmg; do
            [ -f "$c" ] || continue
            dmg="$c"
            break
          done
          if [ -z "$dmg" ]; then
            echo "no Xcode disk image in $RUNNER_TEMP/xcode-dmg -- the cache restore" \
                 "reported a hit but produced nothing, or reassembly was skipped." >&2
            exit 1
          fi

          mnt="$RUNNER_TEMP/xcode-mnt"
          tc="$RUNNER_TEMP/xcode-toolchain"
          rm -rf "$mnt" "$tc"
          mkdir -p "$mnt"

          detach() {
            hdiutil detach -quiet "$mnt" >/dev/null 2>&1 \
              || hdiutil detach -quiet -force "$mnt" >/dev/null 2>&1 \
              || echo "warning: could not detach $mnt" >&2
          }
          trap detach EXIT INT TERM
          yes | PAGER=cat hdiutil attach -quiet -nobrowse -readonly -noverify \
            -noautoopen -mountpoint "$mnt" "$dmg"

          dev="$mnt/Xcode.app/Contents/Developer"
          xct="$dev/Toolchains/XcodeDefault.xctoolchain"
          [ -x "$xct/usr/bin/clang" ] || {
            echo "$dmg does not contain XcodeDefault.xctoolchain/usr/bin/clang" >&2
            exit 1
          }

          mkdir -p "$tc/usr/bin" "$tc/usr/lib/clang" "$tc/SDKs"
          cp "$xct/usr/bin/clang" "$xct/usr/bin/ld" "$tc/usr/bin/"
          cp -R "$xct/usr/lib/clang/"* "$tc/usr/lib/clang/"

          # Resolve rather than assume: 6.4 ships iPhoneOS.sdk real with
          # iPhoneOS8.4.sdk as the symlink, 5.1.1 is the other way round, and
          # copying the wrong name leaves a dangling link. See the build job.
          sdks="$dev/Platforms/iPhoneOS.platform/Developer/SDKs"
          real=''
          for c in "$sdks"/iPhoneOS*.sdk; do
            [ -d "$c" ] && [ ! -L "$c" ] || continue
            real="$c"
            break
          done
          [ -n "$real" ] || {
            echo "no real iPhoneOS SDK directory under $sdks" >&2
            exit 1
          }
          name=$(basename "$real")
          mkdir -p "$tc/SDKs/$name/usr"
          cp -R "$real/usr/include" "$tc/SDKs/$name/usr/include"
          cp -R "$real/usr/lib" "$tc/SDKs/$name/usr/lib"
          cp "$real/SDKSettings.plist" "$tc/SDKs/$name/"

          # The two frameworks entrypoint links. Same reasoning as the build
          # job's copy of these -- see the long comment there. Kept in both
          # because the two jobs extract independently, and a bake leg that
          # silently lacked them would fail at the Makefile's FATAL guard
          # partway through a run that has already paid for an IPSW download.
          mkdir -p "$tc/SDKs/$name/System/Library/Frameworks" \
                   "$tc/SDKs/$name/System/Library/PrivateFrameworks"
          cp -R "$real/System/Library/PrivateFrameworks/IOSurface.framework" \
                "$tc/SDKs/$name/System/Library/PrivateFrameworks/"
          cp -R "$real/System/Library/Frameworks/CoreFoundation.framework" \
                "$tc/SDKs/$name/System/Library/Frameworks/"
          ln -s "$name" "$tc/SDKs/iPhoneOS.sdk"

          detach
          trap - EXIT INT TERM

          # Already mined and cached, and this leg still has an IPSW download
          # and a ramdisk bake ahead of it. 2.6 GB is worth reclaiming.
          rm -rf "$RUNNER_TEMP/xcode-dmg"

          "$tc/usr/bin/clang" --version
          "$tc/usr/bin/ld" -v 2>&1 | head -1
          du -sh "$tc"

          echo "XCODE_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # sudo env: bake-firmware requires root, and sudo does not preserve PATH,
      # so Homebrew's ldid/afsctool/dpkg-scanpackages would vanish. THEOS is
      # passed explicitly for the same reason.
      #
      # XCODE_TOOLCHAIN and DEVICE are on that list for exactly the same
      # reason, and it is the one place the "just export it" interface does not
      # hold. buildEntrypointBinary() reaches entrypoint/Makefile through
      # fork()/execvp(), which inherits `environ` -- but this process's environ
      # is sudo's, not the job's, and sudo dropped both variables before
      # bake-firmware ever started. Without them make falls back to `auto`,
      # goes looking in a ~/Downloads that does not exist on a runner, and
      # hard-fails (it will not substitute the system compiler). Which is the
      # correct behaviour, and the reason these two names have to be here.
      #
      # --diagnostic-ramdisks IS NO LONGER PASSED, AND THE FLAG IS STILL THERE.
      # The three diagnostic images existed to bisect one question -- why a
      # booted ramdisk showed nothing -- and they answered it: repack alone is
      # fine, size is not the problem, the binary runs and AMFI accepts it, a
      # job exiting is what takes the system down, and /dev/console never
      # reaches the display. With those settled there is nothing left for them
      # to isolate, and baking them costs this leg three extra ramdisk bakes on
      # every push. The flag stays in bake-firmware for a future bisect that
      # needs it; what changes here is only that CI does not spend the time
      # speculatively. See src/BakeRamdisk.hpp's RamdiskVariant for what each
      # image isolates, and docs/HISTORY.md for what they found.
      - name: Bake
        run: |
          sudo env "PATH=$PATH" "THEOS=$HOME/theos" \
                   "XCODE_TOOLCHAIN=$XCODE_TOOLCHAIN" "DEVICE=$DEVICE" \
            ./build/bake-firmware --device '${{ matrix.device }}' \
                                  --build '${{ steps.target.outputs.build }}'

      - name: Check the bake produced a complete, uploadable suite
        run: |
          set -eux
          suffix="-${{ matrix.device }}_${{ steps.target.outputs.build }}"
          # iBECTether is the second baked iBEC: the same patched bootloader
          # with rd=disk0s1s1 compiled in instead of rd=md0, for --tether-boot.
          # Boot-args are compiled into iBEC (this bootloader never reads the
          # boot-args env var), so the two modes need two images and a suite
          # missing this one silently breaks --tether-boot.
          for c in iBSS iBEC iBECTether KernelCache DeviceTree; do
            test -s "dist/${c}${suffix}"
          done
          test -s "dist/RestoreRamDisk${suffix}.dmg"
          test -s "dist/Manifest${suffix}.txt"
          # The 64 MiB ceiling is a real hardware limit (a live AppleTV3,2
          # short-writes at exactly 0x4000000), and bake-firmware already
          # hard-fails past it. Re-checked here so an artifact that cannot be
          # uploaded to a device never reaches a release.
          size=$(stat -f%z "dist/RestoreRamDisk${suffix}.dmg")
          echo "ramdisk is $size bytes ($((size / 1048576)) MiB)"
          test "$size" -le $((64 * 1024 * 1024))

          # The three diagnostic images used to be asserted here. They are no
          # longer built on every run -- see the Bake step above -- so there is
          # nothing to assert. If --diagnostic-ramdisks is ever passed again,
          # the same 64 MiB ceiling applies to them: each is smaller than the
          # real ramdisk by construction, so one at or over the ceiling would
          # mean the bake did something nobody predicted.

      # The artifact name is a contract with ensureBakedFirmware() (Cli.cpp),
      # which runs `gh run download -n "firmware-<deviceModel>"` -- device only,
      # no build ID. Do not fold the build into it: one name per device is what
      # blackb0x asks for, the three device names cannot collide, and keeping
      # the name stable is what lets the target build move without breaking
      # every installed copy of blackb0x. The suite inside is what identifies
      # the build, through its Manifest-<device>_<build>.txt entry.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          path: dist/
          # Longer than the monthly refresh, so a failed scheduled run still
          # leaves the previous set downloadable.
          retention-days: 90
          if-no-files-found: error

  # Every .deb this project ships, built and published as one artifact, so the
  # repo at https://ios.regulad.xyz can be updated by downloading and copying
  # rather than by running a bake.
  #
  # WHY THIS IS A SEPARATE JOB AND NOT PART OF `bake`. The bake does build two
  # of these three packages -- stageBlackb0xPackage() and
  # stageCainjectorPackage() call the same scripts -- but it builds them INTO A
  # RAMDISK and throws the .deb away, once per device, as a side effect of a
  # ~30-minute job that needs root, an IPSW download and a working patcher.
  # Feeding an apt repo needs none of that: the three packages are
  # architecture-wide (iphoneos-arm), identical across all three devices, and
  # none of them needs the C++ authoring tools at all -- every build script
  # here is standalone. So this job is minutes, not half an hour, and one run
  # produces what the repo needs for every device.
  debs:
    name: Build .debs for the apt repo
    needs: build
    # Needs secrets.PAT for the Xcode mirror, which a fork PR cannot have.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    env:
      # Fixed, not matrixed. cainjector and appliancetvtweak are armv7 against
      # the iPhoneOS 8.4 SDK regardless of which Apple TV installs them, and
      # 6.4 is the Xcode that carries it (see entrypoint/Makefile's table).
      # The 5.1.1/7.1 pairing exists for entrypoint, which is spliced into a
      # per-device ramdisk; nothing in a .deb is per-device.
      XCODE_VERSION: "6.4"
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS, because appliancetvtweak/Makefile unpacks CydiaSubstrate out
          # of debcache/mobilesubstrate_*.deb and package/build.sh copies
          # local_only_debs.txt's entries into the bundled local repo. Both are
          # LFS-backed. No submodules: nothing here builds C++.
          lfs: true

      # dpkg for dpkg-deb and dpkg-scanpackages, ldid for signing the two
      # compiled payloads. Deliberately not the bake job's full list -- no
      # cmake, no autotools, no berkeley-db.
      - name: Install packaging dependencies
        run: brew install ldid dpkg

      # dm.pl only, exactly as the bake job does it: a standalone Perl script
      # using core modules, symlinked to the vendor/dm.pl submodule. None of
      # Theos' toolchain is involved -- and could not be, since its vendored
      # SDKs are arm64-only and cannot target armv7.
      - name: Install Theos (dm.pl only)
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --depth 1 vendor/dm.pl
          test -x "$HOME/theos/bin/dm.pl"

      - name: Check out the Xcode mirror's LFS pointers
        env:
          XCODE_MIRROR_TOKEN: ${{ secrets.PAT }}
        run: |
          set -eu
          if [ -z "${XCODE_MIRROR_TOKEN:-}" ]; then
            echo "secrets.PAT is empty. cainjector and appliancetvtweak are armv7" \
                 "binaries and cannot be built without a pinned Xcode, and" \
                 "regulad/xcode is private, so there is nothing to fall back to." >&2
            exit 1
          fi
          rm -rf xcode-mirror
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            "https://x-access-token:${XCODE_MIRROR_TOKEN}@github.com/regulad/xcode.git" \
            xcode-mirror
          for p in xcode-mirror/parts/"$XCODE_VERSION"/*.part??; do
            grep -q '^oid sha256:' "$p" || {
              echo "$p is not a Git LFS pointer -- the mirror's layout changed," \
                   "or this clone resolved LFS objects when it should not have." >&2
              exit 1
            }
          done

      # Same cache the bake job uses, keyed the same way: on the POINTERS, which
      # are cheap to fetch, rather than on the multi-gigabyte image itself.
      - name: Restore the cached Xcode disk image
        id: xcode-dmg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xcode-dmg
          key: xcode-dmg-${{ runner.os }}-6.4-${{ hashFiles('xcode-mirror/parts/6.4/*') }}

      - name: Reassemble the Xcode disk image
        if: steps.xcode-dmg.outputs.cache-hit != 'true'
        working-directory: xcode-mirror
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/xcode-dmg"
          ./reassemble.sh --fetch --consume --out "$RUNNER_TEMP/xcode-dmg" "$XCODE_VERSION"

      - name: Save the Xcode disk image to the cache
        if: steps.xcode-dmg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xcode-dmg
          key: ${{ steps.xcode-dmg.outputs.cache-primary-key }}

      # A THINNER SLICE THAN THE BAKE JOB'S, and a different one. That job
      # copies IOSurface and CoreFoundation, which is what entrypoint links.
      # These two packages link CoreFoundation, Security (cainjector's
      # SecTrustStore* calls) and Foundation (the tweak is Objective-C), so
      # those are the three frameworks taken. libSystem and libobjc arrive
      # with usr/lib wholesale.
      - name: Extract the pinned toolchain
        run: |
          set -eu
          dmg=''
          for c in "$RUNNER_TEMP"/xcode-dmg/*.dmg; do
            [ -f "$c" ] || continue
            dmg="$c"
            break
          done
          if [ -z "$dmg" ]; then
            echo "no Xcode disk image in $RUNNER_TEMP/xcode-dmg -- the cache restore" \
                 "reported a hit but produced nothing, or reassembly was skipped." >&2
            exit 1
          fi

          mnt="$RUNNER_TEMP/xcode-mnt"
          tc="$RUNNER_TEMP/xcode-toolchain"
          rm -rf "$mnt" "$tc"
          mkdir -p "$mnt"

          detach() {
            hdiutil detach -quiet "$mnt" >/dev/null 2>&1 \
              || hdiutil detach -quiet -force "$mnt" >/dev/null 2>&1 \
              || echo "warning: could not detach $mnt" >&2
          }
          trap detach EXIT INT TERM

          # SC2209 is a false positive here: PAGER=cat is an environment
          # prefix to hdiutil, not an assignment of the string "cat".
          # shellcheck disable=SC2209
          yes | PAGER=cat hdiutil attach -quiet -nobrowse -readonly -noverify \
            -noautoopen -mountpoint "$mnt" "$dmg"

          dev="$mnt/Xcode.app/Contents/Developer"
          xct="$dev/Toolchains/XcodeDefault.xctoolchain"
          [ -x "$xct/usr/bin/clang" ] || {
            echo "$dmg does not contain XcodeDefault.xctoolchain/usr/bin/clang" >&2
            exit 1
          }

          mkdir -p "$tc/usr/bin" "$tc/usr/lib/clang" "$tc/SDKs"
          cp "$xct/usr/bin/clang" "$xct/usr/bin/ld" "$tc/usr/bin/"
          cp -R "$xct/usr/lib/clang/"* "$tc/usr/lib/clang/"

          # Resolve rather than assume which of iPhoneOS.sdk / iPhoneOS8.4.sdk
          # is the real directory and which is the symlink -- 6.4 and 5.1.1
          # disagree, and the Makefiles probe for SDKs/iPhoneOS<ver>.sdk.
          sdks="$dev/Platforms/iPhoneOS.platform/Developer/SDKs"
          real=''
          for c in "$sdks"/iPhoneOS*.sdk; do
            [ -d "$c" ] && [ ! -L "$c" ] || continue
            real="$c"
            break
          done
          [ -n "$real" ] || {
            echo "no real iPhoneOS SDK directory under $sdks" >&2
            exit 1
          }
          name=$(basename "$real")

          mkdir -p "$tc/SDKs/$name/usr"
          cp -R "$real/usr/include" "$tc/SDKs/$name/usr/include"
          cp -R "$real/usr/lib" "$tc/SDKs/$name/usr/lib"
          cp "$real/SDKSettings.plist" "$tc/SDKs/$name/"
          mkdir -p "$tc/SDKs/$name/System/Library/Frameworks"
          for fw in CoreFoundation Security Foundation; do
            cp -R "$real/System/Library/Frameworks/$fw.framework" \
                  "$tc/SDKs/$name/System/Library/Frameworks/"
          done
          ln -s "$name" "$tc/SDKs/iPhoneOS.sdk"

          detach
          trap - EXIT INT TERM
          rm -rf "$RUNNER_TEMP/xcode-dmg"

          "$tc/usr/bin/clang" --version
          du -sh "$tc"
          echo "XCODE_TOOLCHAIN=$tc" >> "$GITHUB_ENV"

      # DATE.RUN_NUMBER, because an apt repo needs versions that only ever go
      # up. The date dominates and the run number breaks ties within a day, so
      # any later build sorts above any earlier one under dpkg's own comparison
      # -- which a bare run number would not survive if this workflow were ever
      # renamed and its counter reset.
      - name: Compute the package version
        id: version
        run: |
          set -eu
          echo "value=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build every .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          export THEOS="$HOME/theos"
          out="$PWD/dist/debs"
          mkdir -p "$out"

          # The main package is the only one that needs a staging tree handed
          # to it -- normally bakeRamdisk() assembles one because postinstall.sh
          # is templated and the bundled local repo depends on what that bake
          # resolved. Neither applies here: build.sh templates postinstall.sh
          # from package/packages.txt itself and fills the local repo from
          # local_only_debs.txt, so a plain copy of package/layout is a complete
          # input.
          stage="$RUNNER_TEMP/blackb0x-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R package/layout/. "$stage/"
          package/build.sh "$stage" \
            "$out/xyz.regulad.blackb0x_${VERSION}_iphoneos-arm.deb" "$VERSION"

          package/build_cainjector.sh \
            "$out/xyz.regulad.blackb0x.cainjector_${VERSION}_iphoneos-arm.deb" "$VERSION"

          package/build_appliancetvtweak.sh \
            "$out/xyz.regulad.blackb0x.appliancetvtweak_${VERSION}_iphoneos-arm.deb" "$VERSION"

      # Assert what the repo actually depends on, rather than trusting that
      # three scripts exiting 0 means three usable packages. Each of these has
      # been a real failure at least once: a .deb built with the host's own
      # architecture, an unsigned payload that installs fine and never runs,
      # and a maintainer script left non-executable so dm.pl refuses it.
      - name: Check the packages are what they claim to be
        run: |
          set -eu
          cd dist/debs
          fail=0

          for d in *.deb; do
            arch=$(dpkg-deb -f "$d" Architecture)
            [ "$arch" = "iphoneos-arm" ] || {
              echo "$d: Architecture is '$arch', expected iphoneos-arm" >&2
              fail=1
            }
            dpkg-deb -f "$d" Version | grep -qv '__BLACKB0X_VERSION__' || {
              echo "$d: version placeholder was never substituted" >&2
              fail=1
            }
          done

          # The two compiled payloads: armv7 Mach-O, and signed. An unsigned
          # binary installs and then silently never runs, which is the single
          # most expensive failure mode this project has hit.
          work="$RUNNER_TEMP/deb-check"
          rm -rf "$work"
          for d in *cainjector*.deb *appliancetvtweak*.deb; do
            ex="$work/$(basename "$d" .deb)"
            mkdir -p "$ex"
            dpkg-deb -x "$d" "$ex"
            found=0
            for bin in "$ex/usr/libexec/blackb0x/cainjector" \
                       "$ex/Library/MobileSubstrate/DynamicLibraries/appliancetvtweak.dylib"; do
              [ -f "$bin" ] || continue
              found=1
              file -b "$bin" | grep -q arm_v7 || {
                echo "$d: $(basename "$bin") is not armv7 ($(file -b "$bin"))" >&2
                fail=1
              }
              codesign -dv "$bin" >/dev/null 2>&1 || {
                echo "$d: $(basename "$bin") carries no code signature" >&2
                fail=1
              }
            done
            [ "$found" = 1 ] || { echo "$d: no expected payload binary found" >&2; fail=1; }
          done

          exit "$fail"

      # A real dpkg-scanpackages index alongside the .debs, so updating the
      # repo is a copy rather than a rebuild. Unsigned: signing is the repo's
      # own business and its key does not belong on a CI runner.
      - name: Generate a Packages index
        working-directory: dist/debs
        run: |
          set -eu
          dpkg-scanpackages . /dev/null > Packages
          gzip -9kf Packages
          echo "--- Packages ---"
          grep -E '^(Package|Version|Architecture|Depends):' Packages

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/debs/
          retention-days: 90
          if-no-files-found: error
